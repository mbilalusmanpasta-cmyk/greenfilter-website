  <script>

    (function () {
      function process() {
        // Attributions are passed as URL parameters to the checkout URL
        window.RCFX_SERIALIZED_URL_PARAMS = window.RCFX_SERIALIZED_URL_PARAMS || '';
        window.mcfx(function (tracker) {
          const urlParams = {
            // required
            utm_source: tracker.visitor.get('utms') || '',
            utm_medium: tracker.visitor.get('utmm') || '',
            utm_campaign: tracker.visitor.get('utmc') || '',
            gclid: tracker.visitor.get('gclid') || '',
            gbraid: tracker.visitor.get('gbraid') || '',
            wbraid: tracker.visitor.get('wbraid') || '',
            msclkid: tracker.visitor.get('msclkid') || '',
            fbclid: tracker.visitor.get('fbclid') || '',
            twclid: tracker.visitor.get('twclid') || '',
            // optional
            fx_uid: tracker.visitor.get('uid') || '',
            fx_sid: tracker.visitor.get('sid') || '',
            fx_source: tracker.visitor.get('s') || '',
            fx_medium: tracker.visitor.get('m') || '',
            fx_referrer: tracker.visitor.get('r') || '',
          };
          window.RCFX_SERIALIZED_URL_PARAMS = Object.keys(urlParams).map(function (key) {
            return key + '=' + urlParams[key];
          }).join('&');
        });
      }
      function mcfxEnabled() {
        var status = 'inactive';
        if (typeof window.mcfx === 'undefined') {
          return false;
        }
        window.mcfx(function (t) {
          status = t.configuration.status
        });
        return status === 'active';
      }
      if (mcfxEnabled()) {
        process();
      } else {
        window.addEventListener('mcfx:initialized', process);
      }
    })();

    (function () {
      ShopifyBuyInit();

      function ShopifyBuyInit() {
        var client = ShopifyBuy.buildClient({
          domain: 'store.greenfilter.com',
          storefrontAccessToken: 'b0f6e285934ab0374588e085bda31072',
          appId: '6',
        });

        ShopifyBuy.UI.onReady(client).then(function (ui) {
          ui.createComponent('product', {
            options: {
              cart: {
                events: {
                  afterInit: (cart) => {
                    // Track add to cart events
                    cart.model.on('lineItemsAdded', function(lineItems) {
                      if (window.dataLayer) {
                        lineItems.forEach(function(lineItem) {
                          window.dataLayer.push({
                            event: 'add_to_cart',
                            currency: 'USD',
                            value: parseFloat(lineItem.variant.price.amount) * lineItem.quantity || 0,
                            items: [{
                              item_id: lineItem.variant.sku || lineItem.variant.id,
                              item_name: lineItem.title || 'Unknown Product',
                              item_brand: 'Green Filter',
                              item_category: 'Air Filters',
                              price: parseFloat(lineItem.variant.price.amount) || 0,
                              quantity: lineItem.quantity
                            }]
                          });
                        });
                      }
                    });

                    cart.onCheckout = () => {
                      // Track begin checkout event
                      if (window.dataLayer) {
                        var cartTotal = parseFloat(cart.model.subtotal) || 0;
                        window.dataLayer.push({
                          event: 'begin_checkout',
                          currency: 'USD',
                          value: cartTotal,
                          checkout_url: cart.model.webUrl
                        });
                      }

                      // Add tracking parameters to checkout URL if available
                      let checkoutUrl = cart.model.webUrl;
                      if (window.RCFX_SERIALIZED_URL_PARAMS) {
                        checkoutUrl = cart.model.webUrl + (cart.model.webUrl.indexOf('?') > -1 ? '&' : '?') + window.RCFX_SERIALIZED_URL_PARAMS;
                      }
                      window.open(checkoutUrl, '_self');
                    }
                  }
                }
              }
            }
          })

        });
      }
    })();
  </script>
